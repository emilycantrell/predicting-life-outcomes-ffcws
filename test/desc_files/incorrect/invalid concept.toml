[summary]
  name = "E2E test"
  description = "Goal of this experiment is to test job file with incorrect concept file"
[execution]
  [execution.infrastructure]
  parallel = false
  [execution.database]
  results_database = "e2etest"
  database_type_to_use = "inmemory" # possible options are mongo (production) and inmemory (testing)

[data]
  participant_id_column = "ChallengeID"
  training_participant_ids = "all"
  remove_participants_collected_in_nonresponse_followup_Columbia = true

[data.files]
  features = ["./datasets/testdata/regression/features.csv", "89cf7dfd8d2d721b246ca1c9408bbd11"]
  outcomes = ["./datasets/testdata/regression/outcomesv2.csv", "8a9fb3dee15543ba06ac8d3c70af007b"]
  metadata = ["./datasets/testdata/regression/metadata.csv", "9084561f76dd6e7acdfa94caba8f875b"]
  million_monkeys_concepts_metadata = ["./datasets/testdata/regression/test_data_concept2.json", "860ac0e2ece3c43d7fd50c31473b3cc3"]

[data.outcomes]
    regression_outcomes = { topics = [] , outcome_names = ["dep_a", "dep_b", "dep_c"]}

[pipeline]

  [pipeline.models]
    "Continuous" = {methods = ["linear regressor"]}

  [pipeline.features]
    [pipeline.features.filtering]
      mode = ["all"]
    [pipeline.features.selection]
    mode = ["kbest"]
    param = { "kbest" = {"arg" = [5], "metric" = ["f_regression", "spearmanr"] }}

  [pipeline.cv]
    [pipeline.cv.pipeline_performance_estimate]
      nfolds = 5
      min_valid_outcomes = 25
      continuous_to_categorical_bin_method = "quantile" # quantile, sturges, freedman-diaconis
    [pipeline.cv.model_parameter_tuning]
      mode = "randomized_grid_search"
      param = {"randomized_grid_search" = {"iterations"= 1, "nfolds" = 5, "continuous_to_categorical_bin_method" = "quantile"} }

  [pipeline.predictors]
    vartype_to_use = ["Continuous", "Binary", "Ordered Categorical"] # use variables of these types
    waves_to_use = ["Baseline"]
    min_cities = 18 # question must be asked in atleast these number of cities
    always_include = ["ChallengeID"]
    remove_predictors_with_metadata_warning = true # Some variables have warning flags in metadata file. Remove these predictors.
    remove_predictors_of_concept = ["test_data_concept"]

  [pipeline.predictors.preprocessing]
    convert_standard_FF_missing_values_to_na = false # Standard FF missing values are [-9, -1]
    use_one_hot_encoding = false
    variance_threshold = 0.0 # if 0 remove constant columns
    scaler_method = ["identity"]

  [pipeline.predictors.imputation]
    "Binary" = "mean"
    "Ordered Categorical" = "mode"
    "Continuous" = "mean"

  [pipeline.outcomes.preprocessing]
    recode2to0 = false # If set, recodes to binary values
    remove_outcomes_of_concept = ["test_data_concept"]
    remove_outcomes_with_metadata_warning = true # Some variables have warning flags in metadata file. Remove these predictors.

  [pipeline.predictions.postprocessing]
    truncate_predictions = false
